name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Node + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: task_manager
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      NODE_ENV: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install --include=dev

      - name: Lint
        run: npm run lint --if-present

      - name: Build da aplicação
        run: npm run build

      - name: Subir servidor em background
        run: nohup npm run start > server.log 2>&1 &

      - name: Aguardar aplicação ficar saudável
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Aplicação no ar."
              exit 0
            fi
            echo "Aguardando aplicação subir... ($i/30)"
            sleep 2
          done
          echo "Aplicação não ficou saudável a tempo."
          cat server.log
          exit 1

      - name: Rodar testes
        run: npm test

      - name: Logs do servidor (debug)
        if: always()
        run: cat server.log || true

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Se DOCKERHUB_USERNAME/DOCKERHUB_TOKEN não estiverem configurados
      # como secrets do repositório, o job só builda a imagem (sem push),
      # então o workflow continua passando mesmo sem credenciais.
      - name: Definir tag e modo de push
        id: vars
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "tag=${{ secrets.DOCKERHUB_USERNAME }}/task-manager:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=task-manager:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login no Docker Hub
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (e push, se configurado) da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.vars.outputs.push }}
          tags: ${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
